[package]
name = "dezoomify-job"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Deterministic portable job state machine for dezoomify (phase 06 lean engine)."
repository = "https://github.com/lovasoa/dezoomify"

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-protocol = { path = "../dezoomify-protocol" }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Manual lint tables (cargo 1.98 cannot combine `[lints] workspace = true`
# with per-lint overrides in one manifest); the tables mirror the workspace
# policy plus allows until legacy debt clears.
[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"
