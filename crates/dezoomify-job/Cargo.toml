[package]
name = "dezoomify-job"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Deterministic portable job state machine for dezoomify (phase 06 lean engine)."
repository = "https://github.com/lovasoa/dezoomify"

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-protocol = { path = "../dezoomify-protocol" }
serde.workspace = true
serde_json.workspace = true

# 6.1 (unblocked for cargo 1.98: workspace+override does not parse; manual
# tables preserve the allows without inheritance; the deferred `job.rs`
# module split rides after the in-flight Pause v1 overlay lands).
[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"
