[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
dezoomify = { path = "../dezoomify" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
minisign-verify = "0.3.0"
toml.workspace = true
# Fixture tooling shares the fixture server's route schema, content-type
# mapping, and route-id derivation so the two cannot drift.
dezoomify-fixture-server = { path = "../fixture-server" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[lints]
workspace = true
