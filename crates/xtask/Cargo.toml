[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
# Fixture tooling shares the fixture server's route schema, content-type
# mapping, and route-id derivation so the two cannot drift.
dezoomify-fixture-server = { path = "../fixture-server" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

# 6.1 (unblocked for cargo 1.98): pedantic cleanups pending.
[lints.clippy]
pedantic = "allow"
