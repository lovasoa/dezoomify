[package]
name = "dezoomify-native"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Host shared by the CLI and desktop app."
repository = "https://github.com/dezoomify/dezoomify"

[dependencies]
dezoomify = { path = "../dezoomify" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
rustls.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
webpki-roots = "1"
url.workspace = true
sha2.workspace = true
sysinfo.workspace = true
# AVIF needs both features for parallelism and SIMD; release optimization alone is insufficient.
image = { workspace = true, features = ["tiff", "webp", "avif", "rayon", "nasm"] }
tiff = "0.11"
scraper = { version = "0.29", default-features = false }
tempfile = "3.27"
zif-tiff = "0.3.0"
png = "0.18.1"
flate2 = "1"
openjp2 = { version = "0.7.2", default-features = false, features = ["image"] }
pdf-writer = { git = "https://github.com/dezoomify/pdf-writer", rev = "0c2c8bb4ae4b70bfa53596aff6c601686c579a46", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio.workspace = true
dezoomify-fixture-server = { path = "../fixture-server" }
hayro-syntax = { version = "0.9", default-features = false, features = ["std"] }

[lints]
workspace = true
