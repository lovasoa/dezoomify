[package]
name = "dezoomify-native"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native effect runtime shared by the CLI and desktop app."
repository = "https://github.com/lovasoa/dezoomify-ng"

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-protocol = { path = "../dezoomify-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
url = "2.5"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
dezoomify-fixture-server = { path = "../fixture-server" }
axum = "0.8"
