[package]
name = "dezoomify-native"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Host shared by the CLI and desktop app."
repository = "https://github.com/lovasoa/dezoomify"

[dependencies]
dezoomify = { path = "../dezoomify" }
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
webpki-roots = "1"
url.workspace = true
sha2.workspace = true
sysinfo.workspace = true
image = { workspace = true, features = ["tiff", "webp"] }
tiff = "0.11"
scraper = { version = "0.27", default-features = false }
tempfile = "3.27"
fdeflate = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio.workspace = true
dezoomify-fixture-server = { path = "../fixture-server" }

# Known debt: runtime docs and pedantic cleanups pending.
[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"
