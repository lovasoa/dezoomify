[package]
name = "dezoomify-native"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native effect runtime shared by the CLI and desktop app."
repository = "https://github.com/lovasoa/dezoomify"

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-job = { path = "../dezoomify-job" }
dezoomify-protocol = { path = "../dezoomify-protocol" }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
rustls.workspace = true
url.workspace = true
sha2.workspace = true
image = { workspace = true, features = ["tiff", "webp"] }
tiff = "0.11"

[dev-dependencies]
tokio.workspace = true
dezoomify-fixture-server = { path = "../fixture-server" }
axum.workspace = true
criterion = "0.8"

[[bench]]
name = "native_pipeline"
harness = false

# 6.1 debt (unblocked for cargo 1.98): runtime docs and pedantic cleanups
# pending.
[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"
