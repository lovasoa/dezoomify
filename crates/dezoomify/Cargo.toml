[package]
name = "dezoomify"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "Image discovery, tile geometry, and asynchronous dezooming through injected platform capabilities."
repository = "https://github.com/lovasoa/dezoomify"
keywords = ["image", "download"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
quick-xml.workspace = true
json5.workspace = true
url.workspace = true
regex.workspace = true
memchr.workspace = true
custom_error.workspace = true
evalexpr.workspace = true
itertools.workspace = true
krpano-decrypt.workspace = true
base64.workspace = true
hmac.workspace = true
sha1.workspace = true
aes.workspace = true
cbc.workspace = true
thiserror.workspace = true
html-escape = "0.3"
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
futures-util = "0.3"
serde_bytes = "0.11"
zif-tiff = { version = "0.3.0", default-features = false }

[dev-dependencies]
futures = "0.3"
scraper = { version = "0.27", default-features = false }

[features]
typescript = ["dep:tsify", "dep:wasm-bindgen"]

[lints]
workspace = true
