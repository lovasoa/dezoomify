[package]
name = "dezoomify-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Authoritative deterministic job engine for dezoomify (formats, discovery, plan, processing, job policy). Pure: no I/O, clocks, or tasks."
repository = "https://github.com/lovasoa/dezoomify"

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-protocol = { path = "../dezoomify-protocol" }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"
