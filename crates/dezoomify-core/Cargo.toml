[package]
name = "dezoomify-core"
version = "2.20.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Pure discovery core for dezoomify-rs: describes zoomable image resources from supplied bytes without performing any I/O."
repository = "https://github.com/lovasoa/dezoomify-rs"
keywords = ["image", "download"]

# 6.1 debt (unblocked for cargo 1.98: `workspace=true` plus overrides does
# not parse here; manual tables preserve the allows without inheritance):
# the public format surface (SPECs, model types) is largely undocumented;
# document it before re-tightening to the workspace warn.
[lints.rust]
missing_docs = "allow"
# 6.1 debt: legacy format parsers use `.expect("static ...")` on
# by-construction invariants (~100 sites). Migrate them to fallible
# constructors returning typed errors before denying `unwrap_used` here.
# (`pedantic` stays denied via the crate-root attribute.)
[lints.clippy]
unwrap_used = "allow"

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serde-xml-rs.workspace = true
quick-xml.workspace = true
json5.workspace = true
url.workspace = true
regex.workspace = true
memchr.workspace = true
custom_error.workspace = true
evalexpr.workspace = true
itertools.workspace = true
krpano-decrypt.workspace = true
base64.workspace = true
hmac.workspace = true
sha1.workspace = true
aes.workspace = true
cbc.workspace = true
thiserror.workspace = true
html-escape.workspace = true
