[package]
name = "dezoomify-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Narrow deterministic WASM adapter over dezoomify-core and dezoomify-protocol (phase 07)."
repository = "https://github.com/lovasoa/dezoomify-ng"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-protocol = { path = "../dezoomify-protocol" }
dezoomify-job = { path = "../dezoomify-job" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
