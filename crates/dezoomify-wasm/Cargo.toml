[package]
name = "dezoomify-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Generated typed WASM adapter over the Dezoomify job engine."
repository = "https://github.com/lovasoa/dezoomify"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-protocol = { path = "../dezoomify-protocol", features = ["typescript"] }
dezoomify-job = { path = "../dezoomify-job" }
serde.workspace = true
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
tsify.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

# Manual lint tables until legacy debt clears (see the workspace policy
# note in the root Cargo.toml).
[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"
