[package]
name = "dezoomify-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Narrow deterministic WASM adapter over dezoomify-core and dezoomify-protocol (phase 07)."
repository = "https://github.com/lovasoa/dezoomify-ng"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dezoomify-core = { path = "../dezoomify-core" }
dezoomify-protocol = { path = "../dezoomify-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
