[package]
name = "dezoomify-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Generated asynchronous Host bindings for Dezoomify."
repository = "https://github.com/lovasoa/dezoomify"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dezoomify = { path = "../dezoomify", features = ["typescript"] }
serde.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen.workspace = true
tsify.workspace = true

# Portable bindings use the workspace's explicit lint policy.
[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"
