[release]
version = "3.0.0"
channel = "stable"

[protocol]
range = "1.0"
min_peer = "1.0"

# Extension store identity (plan 13 step 2: exact IDs from reviewed config,
# never secrets). Updates go to the EXISTING listings below; never create a
# new store item. Extension IDs are public.
[extension.chromium]
id = "iapjjopjejpelnfdonefbffahmcndfbm"
store_url = "https://chrome.google.com/webstore/detail/dezoomify/iapjjopjejpelnfdonefbffahmcndfbm"
# Privacy policy URL set in the Chromium store listing (dashboard field; the
# store API cannot set it). Keep in sync with privacy.html, which the website
# build serves under /beta/ (the .html link 308-redirects to this URL).
privacy_policy_url = "https://dezoomify.ophir.dev/beta/privacy"

[extension.firefox]
# AMO listing identity is still TBD (no Mozilla account wired yet); this is a
# placeholder shape only and must never be used as an allowlist value.
id = "dezoomify@dezoomify.example"

# Desktop updater decision (todo 5.8): automatic in-app updates are
# disabled for this free project. No update host is deployed and no updater
# key exists; users check GitHub Releases manually. Release integrity comes
# from GPG-detached SHA256SUMS (release/gpg-public-key.asc), verified at
# sign and publish time with fail-closed secrets. The retained
# apps/desktop/src-tauri/src/updater.rs validator stays disabled
# (UPDATER_ENABLED = false, empty endpoints/allowlist/key) and every
# candidate fails with `updater.disabled`.
[updater]
enabled = false
channel = "stable"
endpoints = []
pubkey_file = ""
