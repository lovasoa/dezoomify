<!doctype html>
<meta charset="utf-8">
<title>IIIF book with one loaded page</title>
<link rel="alternate" type="application/ld+json" href="manifest.json">
<div id="page"></div>
<script>
  // Minimal loaded OpenSeadragon state: only the first page is in its world.
  const canvas = document.getElementById("page");
  window.viewer = {
    canvas, innerTracker: { element: canvas }, viewport: {},
    source: {
      _id: `${location.origin}/fixtures/iiif/catalog/first`, version: 3,
      width: 512, height: 512, tileFormat: "png",
      tiles: [{ width: 256, scaleFactors: [1, 2] }],
    },
  };
  fetch("manifest.json").then(r => r.arrayBuffer()).then(() => {
    document.documentElement.dataset.viewerReady = "true";
  });
</script>
