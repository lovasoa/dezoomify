name: store-submit

on:
  push:
    branches: [main]
    paths:
      - apps/extension/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/actions/setup-pnpm/action.yml
      - release/config.toml
      - scripts/store-release.mjs
      - .github/workflows/store-submit.yml
  workflow_dispatch:
    inputs:
      browser:
        required: true
        type: choice
        options: [chromium, firefox]
        default: chromium
      release_tag:
        description: "Published GitHub release tag (required for submission)"
        required: true
        type: string
      submit:
        description: "Submit the released ZIP to the existing listing; bypass nightly limits"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      browser:
        required: true
        type: string
      release_plan:
        description: Frozen release metadata from the nightly coordinator
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.submit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Build wasm glue
        run: |
          cargo build -p dezoomify-wasm --profile wasm-release --target wasm32-unknown-unknown
          wasm-bindgen --remove-name-section --target web --out-dir wasm --out-name dezoomify-wasm target/wasm32-unknown-unknown/wasm-release/dezoomify_wasm.wasm
      - name: Package store payload without submitting
        env:
          BROWSER: ${{ inputs.browser || 'chromium' }}
        run: |
          export DEZOOMIFY_VERSION="$(cargo xtask release version)"
          cargo xtask build extension
          cp "target/extension/dezoomify-$BROWSER.zip" "dezoomify-extension-$BROWSER-$DEZOOMIFY_VERSION.zip"
          unzip -t "dezoomify-extension-$BROWSER-$DEZOOMIFY_VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dezoomify-extension
          path: dezoomify-extension-*.zip
          retention-days: 30

  freeze-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.submit
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.freeze.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/store-release.mjs freeze

  submit:
    needs: freeze-manual
    # Reusable runs deliberately have a skipped manual-freeze prerequisite.
    if: always() && !cancelled() && (inputs.release_plan != '' || needs.freeze-manual.result == 'success')
    runs-on: ubuntu-latest
    environment: store-submit
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    concurrency:
      # Shared by scheduled and manual submissions, regardless of branch/ref.
      group: store-submit-${{ inputs.browser }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - name: Submit immutable release and record outcome
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ inputs.browser }}
          RELEASE_PLAN: ${{ inputs.release_plan || needs.freeze-manual.outputs.plan }}
          AUTOMATIC: ${{ inputs.release_plan != '' }}
          CHROME_WS_PUBLISHER_ID: ${{ vars.CHROME_WS_PUBLISHER_ID }}
          CHROME_WS_CLIENT_ID: ${{ secrets.CHROME_WS_CLIENT_ID }}
          CHROME_WS_CLIENT_SECRET: ${{ secrets.CHROME_WS_CLIENT_SECRET }}
          CHROME_WS_REFRESH_TOKEN: ${{ secrets.CHROME_WS_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/store-release.mjs submit
