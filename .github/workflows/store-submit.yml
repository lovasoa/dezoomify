name: store-submit
# Update the EXISTING Chrome Web Store listing (release/config.toml
# [extension.chromium]: iapjjopjejpelnfdonefbffahmcndfbm). Never create a new
# store item: the extension ID is public and comes from release/config.toml.
# Default is dry-run: package the store payload, validate it, and upload it
# as a workflow artifact. Pass upload=true to push a draft to the existing
# listing (chromium only; firefox/AMO credentials are not wired yet), and
# publish=true to publish that draft after upload. Draft upload and publish
# fail closed with a clear message when any required secret is missing.
# Required secrets (OAuth only, no IDs): CHROME_WS_CLIENT_ID,
# CHROME_WS_CLIENT_SECRET, CHROME_WS_REFRESH_TOKEN (one-time owner authorize).
# Uploads use the /upload/ media endpoint; publish uses the items endpoint.
# Optional override secret: CHROME_WS_EXTENSION_ID (emergency only; must match
# release/config.toml unless deliberately overridden).
on:
  # Automatic dry-run on every ng push touching the extension: package,
  # validate, and keep the zip as an artifact. (inputs.upload defaults to
  # false on push, so pushes never touch the store. Manual dispatch with
  # upload=true lights up once these workflows reach the default branch.)
  push:
    branches: [ng] # promotion: switch to [main] at cutover
    paths:
      - apps/extension/**
      - release/config.toml
      - .github/workflows/store-submit.yml
  workflow_dispatch:
    inputs:
      browser:
        required: true
        type: choice
        options: [chromium, firefox]
        default: chromium
      upload:
        description: "Upload draft to the EXISTING listing (needs secrets)"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the uploaded draft after upload (needs secrets)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: store-submit-${{ inputs.browser || 'chromium' }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: store-submit
    timeout-minutes: 30
    env:
      # workflow_dispatch supplies inputs.browser; push runs have no inputs.
      BROWSER: ${{ inputs.browser || 'chromium' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve extension ID from release config
        env:
          CHROME_WS_EXTENSION_ID_OVERRIDE: ${{ secrets.CHROME_WS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          cfg_id=$(python3 -c 'import tomllib; print(tomllib.load(open("release/config.toml","rb"))["extension"]["chromium"]["id"])')
          case "$cfg_id" in
            [a-z]*)
              if [ "${#cfg_id}" -ne 32 ] || printf '%s' "$cfg_id" | grep -q '[^a-z]'; then
                echo "bad extension ID in release/config.toml: $cfg_id"; exit 1;
              fi ;;
            *) echo "bad extension ID in release/config.toml: $cfg_id"; exit 1 ;;
          esac
          if [ -n "${CHROME_WS_EXTENSION_ID_OVERRIDE:-}" ]; then
            echo "warn: CHROME_WS_EXTENSION_ID secret overrides release/config.toml ($cfg_id)"
            echo "EXTENSION_ID=$CHROME_WS_EXTENSION_ID_OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "EXTENSION_ID=$cfg_id" >> "$GITHUB_ENV"
          fi
          echo "target listing: $cfg_id (update in place, no new item)"
      - name: Package store payload
        run: |
          set -euo pipefail
          browser="${BROWSER:-chromium}"
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "apps/extension/generated/manifest.$browser.json")
          ./apps/extension/scripts/package-store.sh "$browser" "dezoomify-extension-$browser-$version.zip"
          unzip -l "dezoomify-extension-$browser-$version.zip" | head -8
          sha256sum "dezoomify-extension-$browser-$version.zip"
          echo "package: ok (dezoomify-extension-$browser-$version.zip)"
      - name: Upload artifact (dry-run record)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dezoomify-extension
          path: dezoomify-extension-*.zip
          retention-days: 30
      - name: Draft upload to Chrome Web Store
        if: inputs.browser == 'chromium' && inputs.upload == true
        env:
          CHROME_WS_CLIENT_ID: ${{ secrets.CHROME_WS_CLIENT_ID }}
          CHROME_WS_CLIENT_SECRET: ${{ secrets.CHROME_WS_CLIENT_SECRET }}
          CHROME_WS_REFRESH_TOKEN: ${{ secrets.CHROME_WS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for v in CHROME_WS_CLIENT_ID CHROME_WS_CLIENT_SECRET CHROME_WS_REFRESH_TOKEN; do
            [ -n "${!v:-}" ] || { echo "missing secret $v (add it in repo settings, then re-run)"; exit 1; }
          done
          [ -n "${EXTENSION_ID:-}" ] || { echo "extension ID did not resolve from release/config.toml"; exit 1; }
          zip=$(ls dezoomify-extension-chromium-*.zip)
          token_resp=$(curl -sS --proto '=https' --max-time 30 -w '\n%{http_code}' -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_WS_CLIENT_ID}" \
            -d "client_secret=${CHROME_WS_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_WS_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token") \
            || { echo "token endpoint unreachable"; exit 1; }
          http_code=$(printf '%s' "$token_resp" | tail -n1)
          token=$(printf '%s' "$token_resp" | head -n -1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          if [ -z "$token" ]; then
            err=$(printf '%s' "$token_resp" | head -n -1 \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error_description", d.get("error","unknown")))' 2>/dev/null \
              || echo "unparseable response")
            echo "token refresh failed: HTTP $http_code: $err"
            echo "hint: re-run apps/extension/scripts/chrome-webstore-publish.sh authorize with the listing-owner account and update the CHROME_WS_REFRESH_TOKEN secret, then re-run"
            exit 1
          fi
          put_resp=$(curl -sS --proto '=https' --max-time 120 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${token}" -H "x-goog-api-version: 2" -X PUT -T "$zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}") \
            || { echo "upload endpoint unreachable"; exit 1; }
          put_code=$(printf '%s' "$put_resp" | tail -n1)
          put_body=$(printf '%s' "$put_resp" | head -n -1)
          put_out=$(printf '%s' "$put_body" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("upload:", d.get("uploadState","unknown")); [print("itemError:", e.get("error_code","?"), "-", e.get("error_detail","")) for e in d.get("itemError", [])]; print(d.get("uploadState",""))') \
            || { echo "upload failed: HTTP $put_code: $(printf '%s' "$put_body" | head -c 300)"; exit 1; }
          printf '%s\n' "$put_out" | head -n -1
          echo "http: $put_code"
          [ "$(printf '%s' "$put_out" | tail -n1)" = "SUCCESS" ] || { echo "upload not accepted (see itemError above)"; exit 1; }
      - name: Publish uploaded draft
        if: inputs.browser == 'chromium' && inputs.upload == true && inputs.publish == true
        env:
          CHROME_WS_CLIENT_ID: ${{ secrets.CHROME_WS_CLIENT_ID }}
          CHROME_WS_CLIENT_SECRET: ${{ secrets.CHROME_WS_CLIENT_SECRET }}
          CHROME_WS_REFRESH_TOKEN: ${{ secrets.CHROME_WS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for v in CHROME_WS_CLIENT_ID CHROME_WS_CLIENT_SECRET CHROME_WS_REFRESH_TOKEN; do
            [ -n "${!v:-}" ] || { echo "missing secret $v (add it in repo settings, then re-run)"; exit 1; }
          done
          token_resp=$(curl -sS --proto '=https' --max-time 30 -w '\n%{http_code}' -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_WS_CLIENT_ID}" \
            -d "client_secret=${CHROME_WS_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_WS_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token") \
            || { echo "token endpoint unreachable"; exit 1; }
          http_code=$(printf '%s' "$token_resp" | tail -n1)
          token=$(printf '%s' "$token_resp" | head -n -1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
          if [ -z "$token" ]; then
            err=$(printf '%s' "$token_resp" | head -n -1 \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error_description", d.get("error","unknown")))' 2>/dev/null \
              || echo "unparseable response")
            echo "token refresh failed: HTTP $http_code: $err"
            echo "hint: re-run apps/extension/scripts/chrome-webstore-publish.sh authorize with the listing-owner account and update the CHROME_WS_REFRESH_TOKEN secret, then re-run"
            exit 1
          fi
          curl -sS --fail --proto '=https' --max-time 120 \
            -H "Authorization: Bearer ${token}" -H "x-goog-api-version: 2" -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish?deployPercentage=100" \
            | python3 -c 'import json,sys; print("publish:", json.load(sys.stdin).get("status","unknown"))'
      - name: Firefox upload guard
        if: inputs.browser == 'firefox' && (inputs.upload == true || inputs.publish == true)
        run: echo "firefox/AMO credentials are not wired yet (no Mozilla account); package validated, upload skipped" && exit 1
