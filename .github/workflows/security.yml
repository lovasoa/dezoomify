name: security
on:
  pull_request: {}
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny@0.20.2
      # The scheduled audit needs the complete policy, not only protocol
      # generation: check carries Rust deny; security carries protocol and
      # JavaScript lockfile audits. The install above is for the TypeScript
      # compiler in `ci check`; the audits themselves read lockfiles.
      - run: cargo xtask ci check
      - run: cargo xtask ci security
