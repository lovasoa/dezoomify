name: security
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: check
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      # The scheduled audit runs the same generated-contract check as pull
      # requests before the Rust and JavaScript lockfile audits.
      - run: cargo xtask ci check
      - run: cargo xtask ci security
