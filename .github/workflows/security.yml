name: security
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned
        with:
          toolchain: 1.98.1 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
      # The scheduled audit runs the same generated-contract check as pull
      # requests before the Rust and JavaScript lockfile audits.
      - run: cargo xtask ci check
      - run: cargo xtask ci security
