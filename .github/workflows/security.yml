name: security
on:
  pull_request: {}
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned
        with:
          toolchain: 1.98.1 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2
      # The scheduled audit runs the same generated-contract check as pull
      # requests before the Rust and JavaScript lockfile audits.
      - run: cargo xtask ci check
      - run: cargo xtask ci security
