name: ci
on:
  pull_request: {}
  push:
    # Single-branch repository: master holds legacy/ and the new app.

    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    # Sharded `cargo xtask ci local`: each leg runs one lane group so PRs get
    # parallel feedback. Local repro stays serial via `cargo xtask ci local`
    # (crates/xtask/src/ci.rs); lane semantics live there, never here.
    name: deterministic (${{ matrix.lane-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane-group:
          - rust
          - wasm
          - browser+web
          - native+scenario
          - desktop
          - extension
          - protocol+security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0: matches .node-version
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: bindgen
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/fixture-server/tests/webapp-e2e/package-lock.json', 'apps/extension/tests/browser/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium (webapp E2E)
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: crates/fixture-server/tests/webapp-e2e
      - name: CI lane (rust)
        if: matrix.lane-group == 'rust'
        run: cargo xtask ci rust
      - name: CI lane (wasm)
        if: matrix.lane-group == 'wasm'
        run: cargo xtask ci wasm
      - name: CI lane (browser)
        if: matrix.lane-group == 'browser+web'
        run: cargo xtask ci browser
      - name: CI lane (web)
        if: matrix.lane-group == 'browser+web'
        run: cargo xtask ci web
      - name: CI lane (native)
        if: matrix.lane-group == 'native+scenario'
        run: cargo xtask ci native
      - name: CI lane (scenario)
        if: matrix.lane-group == 'native+scenario'
        run: cargo xtask test scenario
      - name: CI lane (desktop)
        if: matrix.lane-group == 'desktop'
        run: cargo xtask ci desktop
      - name: CI lane (extension)
        if: matrix.lane-group == 'extension'
        run: cargo xtask ci extension
      - name: CI lane (protocol)
        if: matrix.lane-group == 'protocol+security'
        run: cargo xtask ci protocol
      - name: CI lane (security)
        if: matrix.lane-group == 'protocol+security'
        run: cargo xtask ci security
