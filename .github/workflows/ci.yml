name: ci
on:
  pull_request: {}
  push:
    # Single-branch repository: main holds legacy/ and the new app.

    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-cli:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: cli-release
      - name: Build and exercise the release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEZOOMIFY_VERSION = cargo xtask release version
          if ($LASTEXITCODE -ne 0) { throw 'version failed' }
          Remove-Item target/release-dist -Recurse -Force -ErrorAction SilentlyContinue
          cargo xtask release plan
          if ($LASTEXITCODE -ne 0) { throw 'plan failed' }
          cargo xtask release build --plan "target/release-dist/$env:DEZOOMIFY_VERSION/plan.json" --target cli-windows-x86_64
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          Expand-Archive "target/release-dist/$env:DEZOOMIFY_VERSION/cli-windows-x86_64/*.zip" -DestinationPath target/cli-smoke
          if (-not (Test-Path target/cli-smoke/LICENSE)) { throw 'license missing' }
          & target/cli-smoke/dezoomify-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI failed' }
  deterministic:
    # Keep the same lanes as `cargo xtask ci local`, with parallel feedback.
    name: deterministic (${{ matrix.lane-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane-group: ${{ fromJSON(github.event_name == 'schedule' && '["check", "bindings+security"]' || '["check", "rust", "wasm", "browser+web", "extension", "bindings+security"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          # WASM integration exercises the browser Host; native AVIF tests use Sharp.
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: ${{ (matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension') && 'web' || matrix.lane-group }}
      - if: matrix.lane-group != 'rust'
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        if: matrix.lane-group == 'check'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
      - name: Cache Playwright browsers
        if: matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/fixture-server/tests/webapp-e2e/package.json', 'apps/extension/tests/browser/package.json') }}
      - name: Ensure browser dependencies and pinned revisions
        if: matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        # Both jobs populate the same complete cache. Install is idempotent;
        # one OS dependency pass serves both packages, even on a cache hit.
        run: |
          pnpm --filter webapp-e2e exec playwright install-deps chromium firefox
          pnpm --filter webapp-e2e --filter dezoomify-extension-headless exec playwright install chromium firefox
      - name: Install pinned Firefox driver
        if: matrix.lane-group == 'extension'
        run: pnpm --filter dezoomify-extension-headless install:driver
      - name: CI lanes
        env:
          LANES: ${{ matrix.lane-group }}
        run: |
          for lane in ${LANES//+/ }; do
            echo "::group::CI lane ($lane)"
            cargo xtask ci "$lane"
            echo "::endgroup::"
          done
