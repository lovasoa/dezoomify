name: ci
on:
  pull_request: {}
  push:
    # Single-branch repository: main holds legacy/ and the new app.

    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    # Keep the same lanes as `cargo xtask ci local`, with parallel feedback.
    name: deterministic (${{ matrix.lane-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane-group:
          - check
          - rust
          - wasm
          - browser+web
          - extension
          - bindings+security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          # WASM integration exercises the browser Host; native AVIF tests use Sharp.
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: ${{ (matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension') && 'web' || matrix.lane-group }}
      - if: matrix.lane-group != 'rust'
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        if: matrix.lane-group == 'check'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Cache Playwright browsers
        if: matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/fixture-server/tests/webapp-e2e/package.json', 'apps/extension/tests/browser/package.json') }}
      - name: Ensure browser dependencies and pinned revisions
        if: matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        # Both jobs populate the same complete cache. Install is idempotent;
        # one OS dependency pass serves both packages, even on a cache hit.
        run: |
          pnpm --filter webapp-e2e exec playwright install-deps chromium firefox
          pnpm --filter webapp-e2e --filter dezoomify-extension-headless exec playwright install chromium firefox
      - name: Install pinned Firefox driver
        if: matrix.lane-group == 'extension'
        run: pnpm --filter dezoomify-extension-headless install:driver
      - name: CI lanes
        env:
          LANES: ${{ matrix.lane-group }}
        run: |
          for lane in ${LANES//+/ }; do
            echo "::group::CI lane ($lane)"
            cargo xtask ci "$lane"
            echo "::endgroup::"
          done
