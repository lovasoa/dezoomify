name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/rustup@1f9d37de10b3e3c5e0eda39d824b19d0f1f8c8f5 # pinned toolchain via rust-toolchain.toml
      - run: cargo xtask ci local
