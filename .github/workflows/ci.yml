name: ci
on:
  pull_request: {}
  push:
    # Single-branch repository: master holds legacy/ and the new app.

    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    # Sharded `cargo xtask ci local`: each leg runs one lane group so PRs get
    # parallel feedback. Local repro stays serial via `cargo xtask ci local`
    # (crates/xtask/src/ci.rs); lane semantics live there, never here.
    name: deterministic (${{ matrix.lane-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane-group:
          - check
          - rust
          - wasm
          - browser+web
          - extension
          - protocol+security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          install: ${{ matrix.lane-group == 'check' || matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension' }}
      - name: Set up Rust toolchain (WASM target)
        if: matrix.lane-group == 'wasm' || matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - name: Set up Rust toolchain
        if: matrix.lane-group == 'check' || matrix.lane-group == 'rust' || matrix.lane-group == 'protocol+security'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: bindgen
        # Version-coupled to Cargo.lock (see the action): every workflow that
        # consumes wasm-bindgen resolves the same CLI release, and the
        # installer caches it by that version, so consumers cannot drift.
        if: matrix.lane-group == 'wasm' || matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        if: matrix.lane-group == 'check'
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny@0.20.2
      - name: Cache Playwright Chromium
        id: playwright-cache
        if: matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          # The pnpm workspace lock is the complete JavaScript dependency set.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # Browser binaries are only needed on the legs that drive real
      # browsers (browser+web E2E, extension headless gate): every other leg
      # skips the download entirely. On a cache hit only
      # the OS dependencies are (re)ensured, never the browsers.
      - name: Install Playwright Chromium
        if: matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter webapp-e2e exec playwright install-deps chromium
          else
            pnpm --filter webapp-e2e exec playwright install --with-deps chromium
            # The extension headless gate consumes Playwright from its own
            # workspace package: install its Chromium engine too so a version
            # skew between the two consumers cannot leave one lane without a
            # browser. Aligned versions make this a no-op.
            pnpm --filter dezoomify-extension-headless exec playwright install chromium
          fi
      - name: CI lane (rust)
        if: matrix.lane-group == 'rust'
        run: cargo xtask ci rust
      - name: CI lane (check)
        if: matrix.lane-group == 'check'
        run: cargo xtask ci check
      - name: CI lane (wasm)
        if: matrix.lane-group == 'wasm'
        run: cargo xtask ci wasm
      - name: CI lane (browser)
        if: matrix.lane-group == 'browser+web'
        run: cargo xtask ci browser
      - name: CI lane (web)
        if: matrix.lane-group == 'browser+web'
        run: cargo xtask ci web
      # No desktop lane-group here: desktop.yml owns the desktop suite on
      # three OSes (path-gated to desktop-relevant changes); the rust lane
      # above still compiles and unit-tests the dezoomify-desktop crate on
      # every run as the ubiquitous lean gate.
      - name: CI lane (extension)
        if: matrix.lane-group == 'extension'
        run: cargo xtask ci extension
      - name: CI lane (protocol)
        if: matrix.lane-group == 'protocol+security'
        run: cargo xtask ci protocol
      - name: CI lane (security)
        if: matrix.lane-group == 'protocol+security'
        run: cargo xtask ci security
