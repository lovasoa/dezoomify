name: ci
on:
  pull_request: {}
  push:
    # Single-branch repository: master holds legacy/ and the new app.

    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    # Sharded `cargo xtask ci local`: each leg runs one lane group so PRs get
    # parallel feedback. Local repro stays serial via `cargo xtask ci local`
    # (crates/xtask/src/ci.rs); lane semantics live there, never here.
    name: deterministic (${{ matrix.lane-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane-group:
          - rust
          - wasm
          - browser+web
          - native+scenario
          - extension
          - protocol+security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0: matches .node-version
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: sets PATH on Windows too (corepack shims are not found there)
        with:
          version: 9.12.0 # must match packageManager in package.json
          standalone: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: bindgen
        # Version-coupled to Cargo.lock (see the action): every workflow
        # resolves the same wasm-bindgen-cli release, and the installer
        # caches it by that version, so no workflow drifts or re-downloads.
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny@0.20.2
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          # Single JS lockfile set (enforced by the supply gate in
          # crates/xtask/src/supply.rs): the pnpm workspace lock plus both
          # isolated npm profile locks. Any JS change invalidates browsers.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'crates/fixture-server/tests/webapp-e2e/package-lock.json', 'apps/extension/tests/browser/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # Browser binaries are only needed on the legs that drive real
      # browsers (browser+web E2E, extension headless gate): every other leg
      # skips the npm install and the download entirely. On a cache hit only
      # the OS dependencies are (re)ensured, never the browsers.
      - name: Install Playwright Chromium (webapp E2E)
        if: matrix.lane-group == 'browser+web' || matrix.lane-group == 'extension'
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: crates/fixture-server/tests/webapp-e2e
      - name: CI lane (rust)
        if: matrix.lane-group == 'rust'
        run: cargo xtask ci rust
      - name: CI lane (wasm)
        if: matrix.lane-group == 'wasm'
        run: cargo xtask ci wasm
      - name: CI lane (browser)
        if: matrix.lane-group == 'browser+web'
        run: cargo xtask ci browser
      - name: CI lane (web)
        if: matrix.lane-group == 'browser+web'
        run: cargo xtask ci web
      - name: CI lane (native)
        if: matrix.lane-group == 'native+scenario'
        run: cargo xtask ci native
      - name: CI lane (scenario)
        if: matrix.lane-group == 'native+scenario'
        run: cargo xtask test scenario
      # No desktop lane-group here: desktop.yml owns the desktop suite on
      # three OSes (path-gated to desktop-relevant changes); the rust lane
      # above still compiles and unit-tests the dezoomify-desktop crate on
      # every run as the ubiquitous lean gate.
      - name: CI lane (extension)
        if: matrix.lane-group == 'extension'
        run: cargo xtask ci extension
      - name: CI lane (protocol)
        if: matrix.lane-group == 'protocol+security'
        run: cargo xtask ci protocol
      - name: CI lane (security)
        if: matrix.lane-group == 'protocol+security'
        run: cargo xtask ci security
  attest:
    # Release attestation gate (todo 6.2): after every sharded lane is green,
    # publish the deterministic release-inputs digest. `release-build`
    # re-computes it on the tagged revision with
    # `cargo xtask ci digest --check`; a match skips the serial `ci local`
    # rerun, anything else falls back to it. Never a silent pass.
    name: attest release inputs digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deterministic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo xtask ci digest | tee ci.digest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-inputs-digest
          path: ci.digest
          retention-days: 30
