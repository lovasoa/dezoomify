name: desktop
on:
  pull_request:
    paths: &desktop-paths
      - apps/desktop/**
      - crates/**
      - packages/shared-ui/**
      - packages/browser-runtime/**
      - packages/protocol-ts/**
      - testdata/**
      - scripts/**
      - installer/**
      - generated/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - clippy.toml
      - deny.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/desktop.yml
  push:
    branches: [master]
    paths: *desktop-paths
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Real-window E2E on all three desktop platforms. The embedded WebDriver
  # provider runs the W3C server inside the app, so no external tauri-driver or
  # platform driver is installed; Linux needs a display (Xvfb), macOS and
  # Windows runners provide a GUI session.
  window-e2e:
    name: Window E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev build-essential xvfb xauth
          command -v xvfb-run
          command -v xauth
      - run: cargo xtask test desktop
      - run: cargo xtask build desktop --unsigned-test
      - name: Real-window E2E (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a cargo xtask test desktop --e2e-window
      - name: Real-window E2E (macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo xtask test desktop --e2e-window
  # Every supported release target builds its real bundle, installs it when
  # its host tools are available, and verifies that the window stays alive.
  bundle-smoke:
    name: Bundle smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev build-essential xvfb
      - name: Cache tauri-cli 2.11.4
        id: cli-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.tauri-cli-2.11.4
          key: tauri-cli-2.11.4-${{ runner.os }}
      - name: Install tauri-cli 2.11.4 (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ROOT="$HOME/.tauri-cli-2.11.4"
          if [ ! -x "$ROOT/bin/cargo-tauri" ]; then
            cargo install tauri-cli --version "=2.11.4" --root "$ROOT"
          fi
          echo "$ROOT/bin" >> "$GITHUB_PATH"
      - name: Install tauri-cli 2.11.4 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$HOME\.tauri-cli-2.11.4"
          if (-not (Test-Path "$root\bin\cargo-tauri.exe")) {
            cargo install tauri-cli --version "=2.11.4" --root $root
            if ($LASTEXITCODE -ne 0) { throw "cargo install tauri-cli failed" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value "$root\bin"
      - name: Bundle, install, and launch smoke (Linux deb)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo xtask build desktop 2>&1 | tee bundle.log
          DEB="$(ls -t target/release/bundle/deb/*.deb | head -n 1)"
          sudo dpkg -i "$DEB" || { sudo apt-get install -f -y; sudo dpkg -i "$DEB"; }
          PKG="$(dpkg-deb -f "$DEB" Package)"
          BIN="$(dpkg -L "$PKG" | grep -m1 '/dezoomify-desktop$')"
          code=0
          xvfb-run -a timeout 20 "$BIN" >smoke-launch.log 2>&1 || code=$?
          test "$code" -eq 124
      - name: Bundle, install, and launch smoke (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo xtask build desktop 2>&1 | tee bundle.log
          DMG="$(ls -t target/release/bundle/dmg/*.dmg | head -n 1)"
          MNT="/Volumes/DezoomifyCI"
          printf 'Y\n' | hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          APP_DIR="$(ls -d "$MNT"/*.app | head -n 1)"
          APP_BIN="$APP_DIR/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP_DIR/Contents/Info.plist")"
          "$APP_BIN" >smoke-launch.log 2>&1 & APP_PID=$!
          sleep 15
          kill -0 "$APP_PID"
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          hdiutil detach "$MNT"
      - name: Bundle, install, and launch smoke (Windows nsis or direct exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hasWix = [bool](Get-Command candle -ErrorAction SilentlyContinue)
          $hasNsis = [bool](Get-Command makensis -ErrorAction SilentlyContinue)
          if ($hasWix -and $hasNsis) {
            cargo xtask build desktop 2>&1 | Tee-Object bundle.log
            if ($LASTEXITCODE -ne 0) { throw "bundle build failed" }
            $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $setup) { throw "nsis setup exe missing" }
            Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
            $exe = Get-ChildItem "$env:ProgramFiles\Dezoomify" -Recurse -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
            if (-not $exe) { throw "installed exe missing" }
          } else {
            cargo build --release -p dezoomify-desktop --features tauri --bin dezoomify-desktop 2>&1 | Tee-Object bundle.log
            if ($LASTEXITCODE -ne 0) { throw "window release build failed" }
            $exe = Get-Item target/release/dezoomify-desktop.exe
          }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "smoke launch exited early" }
          Stop-Process -Id $app.Id -Force
      - name: Upload bundle smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-bundle-smoke-${{ matrix.os }}
          path: |
            bundle.log
            smoke-launch.log
          retention-days: 30
