name: desktop
on:
  workflow_dispatch:
  pull_request:
    paths: &desktop-paths
      - apps/desktop/**
      - crates/**
      - packages/shared-ui/**
      - packages/browser-runtime/**
      - packages/wasm-bindings/**
      - testdata/**
      - fixtures/**
      - test/**
      - scripts/**
      - favicon.svg
      - installer/**
      - generated/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - clippy.toml
      - deny.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/desktop.yml
      - .github/actions/**
  push:
    branches: [main]
    paths: *desktop-paths
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Real-window E2E on all three desktop platforms. The embedded W3C WebDriver
  # server runs inside the app, so no external tauri-driver or platform driver
  # is installed; Linux needs a display (Xvfb), macOS and Windows runners
  # provide a GUI session.
  window-e2e:
    if: github.event_name != 'workflow_dispatch'
    name: Window E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable fixture symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: window-e2e
          desktop: true
      - run: cargo xtask test desktop
      - run: cargo xtask build desktop --unsigned-test
      - name: Real-window E2E (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a cargo xtask test desktop --e2e-window
      - name: Real-window E2E (macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo xtask test desktop --e2e-window
  # Every supported release target builds and installs its real bundle, then
  # verifies that the window stays alive. Missing host tools fail the job.
  bundle-install-launch:
    if: github.event_name != 'workflow_dispatch'
    name: Bundle install and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: desktop-bundle
          desktop: true
      - name: Build, install, and launch (Linux deb)
        if: runner.os == 'Linux'
        run: bash scripts/ci-desktop-linux.sh
      - name: Build, install, and launch (macOS dmg)
        if: runner.os == 'macOS'
        run: bash scripts/ci-desktop-macos.sh
      - name: Build, install, and launch (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-desktop-windows.ps1
      - name: Upload bundle install and launch logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-bundle-install-launch-${{ matrix.os }}
          path: |
            bundle.log
            bundle-launch.log
            signature.log
            dmg-installation.png
          retention-days: 30
  signed-macos-e2e:
    name: Signed macOS release E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: desktop-bundle
          desktop: true
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Freeze the checked-out branch's release plan
        id: plan
        run: |
          echo "version=$(cargo xtask release version)" >> "$GITHUB_OUTPUT"
          cargo xtask release plan
      - name: Build and test signed macOS artifacts
        run: cargo xtask release build --plan "target/release-dist/$DEZOOMIFY_VERSION/plan.json" --target desktop-macos-aarch64
        env:
          DEZOOMIFY_VERSION: ${{ steps.plan.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload signing artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signing-e2e-${{ github.sha }}
          path: |
            target/release-dist
            target/macos-signing
          retention-days: 14
