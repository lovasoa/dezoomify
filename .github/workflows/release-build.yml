name: release-build
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0: matches .node-version
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve wasm-bindgen-cli version from Cargo.lock
        id: bindgen
        run: |
          v="$(awk '/^name = "wasm-bindgen"$/{getline; sub(/^version = "/,""); sub(/"$/,""); print; exit}' Cargo.lock)"
          test -n "$v" || { echo "wasm-bindgen version not found in Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}
      - name: Install Playwright Chromium (webapp E2E)
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: crates/fixture-server/tests/webapp-e2e
      # Release gate (docs/releases.md): the full deterministic suite must
      # pass on the tagged revision before any artifact is produced.
      - run: cargo xtask ci local
      - run: cargo xtask release plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: dist/release
  build:
    needs: gate-and-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [cli-linux-x86_64, extension-chromium, extension-firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0: matches .node-version
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Download release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} -n release-plan -D dist
          test -f "dist/release/$(cat release/config.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)/plan.json"
      - run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' release/config.toml | head -1)"
          cargo xtask release build --plan "dist/release/$v/plan.json" --target ${{ matrix.target }}
          # Upload only the target dir; plan.json/notes.md travel separately
          # so the sign job can reassemble the tree without collisions.
          rm "dist/release/$v/plan.json" "dist/release/$v/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.target }}
          path: dist/release
