name: release-build
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: bindgen
        # Version-coupled to Cargo.lock (see the action): the same
        # wasm-bindgen-cli release as sharded CI, cached by that version.
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny@0.20.2
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          # The pnpm workspace lock is the complete JavaScript dependency set.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium (webapp E2E)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter webapp-e2e exec playwright install-deps chromium
          else
            pnpm --filter webapp-e2e exec playwright install --with-deps chromium
          fi
      # Release gate (docs/releases.md): the tagged revision must have passed
      # the full deterministic suite. The sharded `ci` workflow already ran it
      # in parallel; when its `attest` job vouches for this exact commit AND
      # the inputs digest still matches, the serial `ci local` rerun is
      # skipped in favor of the fast release gate. Anything else (no
      # successful sharded run, missing digest, changed inputs, gh failure)
      # falls back to the full serial rerun: slow, but never a silent pass.
      - name: Attest sharded CI for the tag commit
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "tag commit: $sha"
          attested="false"
          run_id="$(gh run list --workflow ci.yml --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$run_id" ]; then
            if gh run download "$run_id" -n ci-inputs-digest -D /tmp/attested-ci 2>/dev/null \
              && cargo xtask ci digest --check "$(cat /tmp/attested-ci/ci.digest)"; then
              attested="true"
              echo "sharded CI run $run_id vouches for $sha with a matching inputs digest"
            else
              echo "attestation unusable (missing digest or inputs changed since CI); falling back to serial ci local"
            fi
          else
            echo "no successful sharded CI run for $sha; falling back to serial ci local"
          fi
          echo "attested=$attested" >> "$GITHUB_OUTPUT"
      - name: Fast release gate (attested inputs)
        if: steps.attest.outputs.attested == 'true'
        run: |
          cargo xtask fixtures verify
          cargo xtask protocol check
      - name: Full deterministic gate (unattested fallback)
        if: steps.attest.outputs.attested != 'true'
        run: cargo xtask ci local
      - run: cargo xtask release plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: target/release-dist
  build:
    needs: gate-and-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [cli-linux-x86_64, desktop-linux-x86_64, extension-chromium, extension-firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - id: bindgen
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Install Linux desktop bundling dependencies
        if: matrix.target == 'desktop-linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev build-essential dpkg-dev
      - name: Install tauri-cli 2.11.4
        if: matrix.target == 'desktop-linux-x86_64'
        run: |
          set -euo pipefail
          root="$HOME/.tauri-cli-2.11.4"
          cargo install tauri-cli --version "=2.11.4" --root "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Download release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf dist
            if gh run download ${{ github.run_id }} -n release-plan -D dist; then
              break
            fi
            test "$attempt" -lt 5 && sleep 10
          done
          v="$(python3 -c 'import tomllib; print(tomllib.load(open("release/config.toml","rb"))["release"]["version"])')"
          mkdir -p target/release-dist
          rm -rf "target/release-dist/$v"
          mv "dist/$v" target/release-dist/
          test -f "target/release-dist/$v/plan.json"
      - run: |
          v="$(python3 -c 'import tomllib; print(tomllib.load(open("release/config.toml","rb"))["release"]["version"])')"
          cargo xtask release build --plan "target/release-dist/$v/plan.json" --target ${{ matrix.target }}
          # Upload only the target dir; plan.json/notes.md travel separately
          # so the sign job can reassemble the tree without collisions.
          rm "target/release-dist/$v/plan.json" "target/release-dist/$v/notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.target }}
          path: target/release-dist
