name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Numbered vX.Y.Z tag
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'rolling' || inputs.ref }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Require green CI for a numbered release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          test -n "$(gh run list --workflow ci.yml --branch main --event push --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
      - name: Freeze plan
        id: plan
        env:
          NUMBERED_REF: ${{ inputs.ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cargo xtask release plan --numbered
          else
            cargo xtask release plan
          fi
          plans=(target/release-dist/*/plan.json)
          test "${#plans[@]}" = 1
          plan="${plans[0]}"
          test -z "$NUMBERED_REF" || test "$NUMBERED_REF" = "$(jq -r .tag "$plan")"
          jq -r '"version=\(.version)\ncommit=\(.commit)\nrelease_tag=\(.tag)"' "$plan" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: target/release-dist

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli-linux-x86_64
            runner: ubuntu-latest
          - target: desktop-linux-x86_64
            runner: ubuntu-latest
          - target: desktop-windows-x86_64
            runner: windows-latest
          - target: desktop-macos-aarch64
            runner: macos-latest
          - target: extension-chromium
            runner: ubuntu-latest
          - target: extension-firefox
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: ${{ matrix.target }}
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Install Linux desktop tools
        if: matrix.target == 'desktop-linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev build-essential dpkg-dev xvfb xauth
      # The prebuilt Tauri CLI comes from `setup-pnpm install: true`
      # (@tauri-apps/cli, pinned in apps/desktop/package.json); no `cargo
      # install` source compile.
      - uses: ./.github/actions/setup-windows-bundlers
        if: matrix.target == 'desktop-windows-x86_64'
      - uses: ./.github/actions/setup-nasm
        if: startsWith(matrix.target, 'cli-') || startsWith(matrix.target, 'desktop-')
      - name: Download plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" -n release-plan -D target/release-dist
      - name: Linux desktop release gate
        if: matrix.target == 'desktop-linux-x86_64'
        env:
          DEZOOMIFY_VERSION: ${{ needs.prepare.outputs.version }}
        run: xvfb-run -a cargo xtask test desktop --e2e-window
      - name: Build artifact (Unix)
        if: runner.os != 'Windows'
        env:
          DEZOOMIFY_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(matrix.target, 'desktop-') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          v="$DEZOOMIFY_VERSION"
          cargo xtask release build --plan "target/release-dist/$v/plan.json" --target "${{ matrix.target }}"
          rm "target/release-dist/$v/plan.json" "target/release-dist/$v/notes.md"
      - name: Build artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DEZOOMIFY_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = $env:DEZOOMIFY_VERSION
          cargo xtask release build --plan "target/release-dist/$v/plan.json" --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { throw "release artifact build failed" }
          Remove-Item "target/release-dist/$v/plan.json", "target/release-dist/$v/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-dist

  verify:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Reassemble artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target
          for name in release-plan release-cli-linux-x86_64 release-desktop-linux-x86_64 release-desktop-windows-x86_64 release-desktop-macos-aarch64 release-extension-chromium release-extension-firefox; do
            gh run download "${{ github.run_id }}" -n "$name" -D dist
          done
          mv dist target/release-dist
      - name: Verify release artifacts
        run: |
          v="${{ needs.prepare.outputs.version }}"
          cargo xtask release verify --plan "target/release-dist/$v/plan.json" --artifacts "target/release-dist/$v"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verified
          path: target/release-dist

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Download verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release-dist
          gh run download "${{ github.run_id }}" -n release-verified -D target/release-dist
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          cargo xtask release verify --plan "target/release-dist/$v/plan.json" --artifacts "target/release-dist/$v"
          cargo xtask release publish --plan "target/release-dist/$v/plan.json" --artifacts "target/release-dist/$v"
