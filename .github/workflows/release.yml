name: release

on:
  schedule:
    - cron: '30 2 * * *'
  # Dispatching a reviewed branch is also the production publication E2E.
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.daily.outputs.version }}
      build: ${{ steps.daily.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-build
      - name: Freeze the UTC date and stop if there is nothing to release
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export DEZOOMIFY_VERSION="$(cargo xtask release version)"
          node scripts/daily-release.mjs
      - name: Require green CI for the exact source commit
        if: steps.daily.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          test -n "$(gh run list --workflow ci.yml --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
      - name: Freeze plan
        if: steps.daily.outputs.build == 'true'
        env:
          DEZOOMIFY_VERSION: ${{ steps.daily.outputs.version }}
        run: |
          rm -rf target/release-dist
          cargo xtask release plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.daily.outputs.build == 'true'
        with:
          name: release-plan
          path: target/release-dist

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli-linux-x86_64
            runner: ubuntu-latest
            cache: cli-release
          - target: desktop-linux-x86_64
            runner: ubuntu-latest
            cache: bundle-smoke
          - target: desktop-windows-x86_64
            runner: windows-latest
            cache: bundle-smoke
          - target: desktop-macos-aarch64
            runner: macos-latest
            cache: bundle-smoke
          - target: extension-chromium
            runner: ubuntu-latest
            cache: web
          - target: extension-firefox
            runner: ubuntu-latest
            cache: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: ./.github/actions/setup-build
        with:
          key: ${{ matrix.cache }}
      - uses: ./.github/actions/setup-wasm-bindgen
      - name: Install Linux desktop tools
        if: matrix.target == 'desktop-linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev build-essential dpkg-dev xvfb xauth
      # The prebuilt Tauri CLI comes from `setup-pnpm install: true`
      # (@tauri-apps/cli, pinned in apps/desktop/package.json); no `cargo
      # install` source compile.
      - uses: ./.github/actions/setup-windows-bundlers
        if: matrix.target == 'desktop-windows-x86_64'
      - uses: ./.github/actions/setup-nasm
        if: startsWith(matrix.target, 'cli-') || startsWith(matrix.target, 'desktop-')
      - name: Download plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf target/release-dist
          gh run download "${{ github.run_id }}" -n release-plan -D target/release-dist
      - name: Linux desktop release gate
        if: matrix.target == 'desktop-linux-x86_64'
        env:
          DEZOOMIFY_VERSION: ${{ needs.prepare.outputs.version }}
        run: xvfb-run -a cargo xtask test desktop --e2e-window
      - name: Build artifact (Unix)
        if: runner.os != 'Windows'
        env:
          DEZOOMIFY_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(matrix.target, 'desktop-') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          v="$DEZOOMIFY_VERSION"
          cargo xtask release build --plan "target/release-dist/$v/plan.json" --target "${{ matrix.target }}"
          rm "target/release-dist/$v/plan.json" "target/release-dist/$v/notes.md"
      - name: Build artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DEZOOMIFY_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = $env:DEZOOMIFY_VERSION
          cargo xtask release build --plan "target/release-dist/$v/plan.json" --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { throw "release artifact build failed" }
          Remove-Item "target/release-dist/$v/plan.json", "target/release-dist/$v/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-dist

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Reassemble artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # rust-cache can restore this directory even after pruning its files.
          rm -rf target/release-dist
          mkdir -p target/release-dist
          for name in release-plan release-cli-linux-x86_64 release-desktop-linux-x86_64 release-desktop-windows-x86_64 release-desktop-macos-aarch64 release-extension-chromium release-extension-firefox; do
            gh run download "${{ github.run_id }}" -n "$name" -D target/release-dist
          done
      - name: Verify and publish the daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          cargo xtask release publish --plan "target/release-dist/$v/plan.json" --artifacts "target/release-dist/$v"

  stores:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    environment: store-submit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - name: Submit the published ZIP and confirm store acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ matrix.browser }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          CHROME_WS_PUBLISHER_ID: ${{ vars.CHROME_WS_PUBLISHER_ID }}
          CHROME_WS_CLIENT_ID: ${{ secrets.CHROME_WS_CLIENT_ID }}
          CHROME_WS_CLIENT_SECRET: ${{ secrets.CHROME_WS_CLIENT_SECRET }}
          CHROME_WS_REFRESH_TOKEN: ${{ secrets.CHROME_WS_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/store-release.mjs submit
