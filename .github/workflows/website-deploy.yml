name: website-deploy
on:
  workflow_dispatch:
    inputs:
      digest:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: website-prod
    timeout-minutes: 30
    steps:
      - run: echo "deploy immutable website digest ${{ inputs.digest }} (preview first, production promotion separate)"
