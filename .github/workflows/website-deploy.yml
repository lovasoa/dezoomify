name: website-deploy
# GitHub Actions builds the entire website into dist/ via scripts/
# build-site.mjs: the legacy site (vendored under legacy/) at / and the new
# app at /beta. It uploads dist/ to the existing Cloudflare Pages project
# (dezoomify) with wrangler; the project's automatic git deployments are
# disabled, so this workflow is the only publisher (see plans/
# website-deploy.md and docs/development.md). Deploys to master are
# production deployments: dezoomify.ophir.dev. Nothing generated is
# committed. Until the CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets
# exist, the deploy and verify steps are skipped with a warning: secrets
# absent means no deploy, ever.
on:
  push:
    branches: [master]
  workflow_dispatch: {}
env:
  SITE_HOST: dezoomify.ophir.dev
  CLOUDFLARE_PROJECT: dezoomify
permissions:
  contents: read
concurrency:
  group: website-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0: matches .node-version
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve wasm-bindgen-cli version from Cargo.lock
        id: bindgen
        run: |
          v="$(awk '/^name = "wasm-bindgen"$/{getline; sub(/^version = "/,""); sub(/"$/,""); print; exit}' Cargo.lock)"
          test -n "$v" || { echo "wasm-bindgen version not found in Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}
      - name: Build the site (mirrors, help, wasm glue, dist/)
        run: node scripts/build-site.mjs
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::website deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set (Pages project migration pending; see plans/website-deploy.md WD4)"
          fi
      - name: Deploy to Cloudflare Pages (master = production)
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT" \
            --branch "${{ github.ref_name }}" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "deploy ${{ github.sha }}"
      - name: Verify the deployment serves both apps and no repository files
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -u
          for i in $(seq 1 24); do
            # / is the legacy site: the dezoomify-web app, served verbatim.
            legacy=$(curl -sS -o /tmp/legacy.html -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/" || true)
            # /beta/ is the new app: honest gate on HTTP 200 plus real app
            # markers (input, entry), not just the word Dezoomify.
            beta=$(curl -sS -o /tmp/beta.html -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/beta/" || true)
            main_js=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/beta/src/main.js" || true)
            discovery_js=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/beta/src/discovery.js" || true)
            # Wasm glue must be served as real JS/wasm. A 200 text/html response
            # masks a missing asset: Firefox then fails the worker with
            # NS_ERROR_CORRUPTED_CONTENT and the site spins in "Finding the
            # zoomable image..." forever.
            wasm_js=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/beta/wasm/dezoomify-wasm.js" || true)
            wasm_bin=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/beta/wasm/dezoomify-wasm_bg.wasm" || true)
            # Both proxy functions must be bound: the new app's metadata relay
            # answers a blocked loopback target itself (403), and the legacy
            # proxy answers a missing url parameter itself (400); a static
            # 405 or a 200 HTML fallback means the route is not live.
            proxy=$(curl -sS -o /tmp/proxy.json -w "%{http_code}" --max-time 20 \
              -H 'Content-Type: application/json' \
              -d '{"targetUrl":"http://127.0.0.1/x.json","protocolVersion":1}' \
              "https://${{ env.SITE_HOST }}/api/proxy" || true)
            legacy_proxy=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/proxy" || true)
            # Pages canonicalizes .../index.html to the directory form (308),
            # so the help gate uses /beta/help/ directly.
            help=$(curl -sS -o /tmp/help.html -w "%{http_code}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/beta/help/" || true)
            # Exposure gate: the deployment must serve only the assembled
            # dist/ tree. Repository files (README, crates) must not appear;
            # match on content, not status.
            readme=$(curl -sS --max-time 20 "https://${{ env.SITE_HOST }}/README.md" || true)
            cargo_toml_ct=$(curl -sS -o /dev/null -w "%{content_type}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/crates/dezoomify-wasm/Cargo.toml" || true)
            repo_files_served=0
            if grep -q "next-generation rewrite" <<<"$readme"; then repo_files_served=1; fi
            if [ "$cargo_toml_ct" = "application/toml" ]; then repo_files_served=1; fi
            if [ "$legacy" = "200" ] \
              && grep -q "rendering-canvas" /tmp/legacy.html \
              && grep -q "zoommanager.js" /tmp/legacy.html \
              && [ "$beta" = "200" ] \
              && grep -q "dz-url-input\|id=\"app\"" /tmp/beta.html \
              && grep -q "src/main.js" /tmp/beta.html \
              && [ "$main_js" = "200" ] && [ "$discovery_js" = "200" ] \
              && [ "$proxy" = "403" ] && [ "$legacy_proxy" = "400" ] \
              && [ "$wasm_js" = "200 application/javascript" ] \
              && [ "$wasm_bin" = "200 application/wasm" ] \
              && [ "$help" = "200" ] && grep -q "dz-help-topics" /tmp/help.html \
              && [ "$repo_files_served" = "0" ] \
              && ! grep -q "14 of 28" /tmp/beta.html; then
              echo "deployment live: legacy=$legacy beta=$beta main.js=$main_js discovery.js=$discovery_js proxy=$proxy legacy_proxy=$legacy_proxy wasm_js=$wasm_js wasm_bin=$wasm_bin help=$help repo_files_served=$repo_files_served"
              exit 0
            fi
            echo "attempt $i: legacy=$legacy beta=$beta main.js=$main_js discovery.js=$discovery_js proxy=$proxy legacy_proxy=$legacy_proxy wasm_js=$wasm_js wasm_bin=$wasm_bin help=$help repo_files_served=$repo_files_served; retrying in 30s"
            sleep 30
          done
          echo "deployment did not serve expected content in time"
          exit 1
