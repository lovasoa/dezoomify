name: website-deploy
# Cloudflare Pages Git integration deploys this branch automatically on push;
# this workflow verifies the live branch preview actually serves the site.
# Promotion: switch `branches` to [main] and SITE_HOST to dezoomify.pages.dev.
on:
  push:
    branches: [ng]
  workflow_dispatch: {}
env:
  SITE_HOST: ng.dezoomify.pages.dev
permissions:
  contents: read
concurrency:
  group: website-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify branch preview serves the site
        run: |
          set -u
          for i in $(seq 1 24); do
            apex=$(curl -sS -o /tmp/apex.html -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/" || true)
            app=$(curl -sS -o /tmp/app.html -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/apps/web/" || true)
            main_js=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/apps/web/src/main.js" || true)
            discovery_js=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/apps/web/src/discovery.js" || true)
            # Honest gate: HTTP 200 plus real app markers (input, entry,
            # classifier), not just the word Dezoomify. Rejects error pages,
            # stale bundles, and placeholder shells.
            if [ "$apex" = "200" ] && [ "$app" = "200" ] \
              && [ "$main_js" = "200" ] && [ "$discovery_js" = "200" ] \
              && grep -q "Dezoomify" /tmp/apex.html && grep -q "Dezoomify" /tmp/app.html \
              && grep -q "dz-url-input\|id=\"app\"" /tmp/app.html \
              && grep -q "src/main.js" /tmp/app.html \
              && ! grep -q "14 of 28" /tmp/app.html; then
              echo "preview live: apex=$apex app=$app main.js=$main_js discovery.js=$discovery_js"
              exit 0
            fi
            echo "attempt $i: apex=$apex app=$app main.js=$main_js discovery.js=$discovery_js; retrying in 30s"
            sleep 30
          done
          echo "branch preview did not serve expected content in time"
          exit 1
