name: website-deploy
# GitHub Actions builds the entire website into dist/ via scripts/
# build-site.mjs: the legacy site (vendored under legacy/) at / and the
# Vite+React app at /beta. It uploads dist/ to the existing Cloudflare Pages project
# (dezoomify) with wrangler; the project's automatic git deployments are
# disabled, so this workflow is the only publisher (see docs/development.md).
# Pushes to master are production deployments; same-repository pull requests
# get stable PR-number preview aliases. Nothing generated is committed.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}
env:
  # Verify against Pages' pages.dev host: it avoids the production zone's bot
  # management, which starts blocking curl's TLS fingerprint after a few
  # bursts and would make the verification flap.
  SITE_HOST: ${{ github.event_name == 'pull_request' && format('pr-{0}.dezoomify.pages.dev', github.event.pull_request.number) || 'dezoomify.pages.dev' }}
  DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  CLOUDFLARE_PROJECT: dezoomify
permissions:
  contents: read
  deployments: write
concurrency:
  group: website-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    # Never give deploy credentials to code from a fork. Same-repository PRs
    # retain the normal pull_request event and are checked out at the merge ref.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.dezoomify.pages.dev', github.event.pull_request.number) || 'https://dezoomify.pages.dev' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
        with:
          install: true
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # pinned
        with:
          toolchain: 1.98.0 # must match rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: bindgen
        uses: ./.github/actions/setup-wasm-bindgen
      - name: Build the site (Vite app, help, wasm glue, dist/)
        run: node scripts/build-site.mjs
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::website deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT" \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "deploy ${{ github.sha }}"
      - name: Verify the deployment serves both apps and no repository files
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -u
          # The custom domain sits in a zone with bot protection: a plain
          # curl user agent gets 403 on every path. Verify with a browser
          # user agent, like real users.
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:132.0) Gecko/20100101 Firefox/132.0"
          curl() { command curl -sS -A "$UA" "$@"; }
          # Content-hash fast path: dist/beta/index.html is copied verbatim
          # by scripts/build-site.mjs, so the served /beta/ bytes must hash
          # identically once THIS build is live (never a stale deploy).
          # Cloudflare Pages injects its Pages Analytics beacon into served
          # HTML at the edge, so the served bytes never equal the uploaded
          # ones: strip that injection before hashing (see normalize_beta
          # below). Backoff keeps early retries cheap while preserving the
          # ~12min budget for slow Pages propagation: 10s, 20s, 40s, then 60s.
          expected_beta_hash="$(sha256sum dist/beta/index.html | cut -d' ' -f1)"
          echo "expected beta content hash: $expected_beta_hash (dist/beta/index.html)"
          # Served HTML arrives with Cloudflare Pages Analytics injected at the
          # edge (the project's analytics toggle); drop every beacon script and
          # its marker comments so the remaining bytes must be exactly the
          # uploaded dist/beta/index.html. Any other served difference still
          # fails the gate.
          normalize_beta() {
            sed -E \
              -e "s#<!-- Cloudflare Pages Analytics -->##g" \
              -e "s#<script[^>]*static\.cloudflareinsights\.com/beacon\.min\.js[^>]*></script>##g" \
              "$1"
          }
          delay=10
          for i in $(seq 1 15); do
            # / is the legacy site: the dezoomify-web app, served verbatim.
            legacy=$(curl -sS -o /tmp/legacy.html -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/" || true)
            # /beta/ is the new app: honest gate on HTTP 200 plus real app
            # markers (input, entry), not just the word Dezoomify.
            beta=$(curl -sS -o /tmp/beta.html -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}/beta/" || true)
            # Vite emits a hashed entry bundle; read its path from the built
            # HTML and probe that exact asset.
            main_asset=$(grep -oE '/beta/assets/index-[A-Za-z0-9_-]+\.js' dist/beta/index.html | head -1)
            main_js=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://${{ env.SITE_HOST }}${main_asset}" || true)
            # Wasm glue must be served as real JS/wasm. A 200 text/html response
            # masks a missing asset: Firefox then fails the worker with
            # NS_ERROR_CORRUPTED_CONTENT and the site spins in "Finding the
            # zoomable image..." forever.
            wasm_js=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/beta/wasm/dezoomify-wasm.js" || true)
            wasm_bin=$(curl -sS -o /dev/null -w "%{http_code} %{content_type}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/beta/wasm/dezoomify-wasm_bg.wasm" || true)
            # Both proxy functions must be bound: the new app's metadata relay
            # answers a blocked loopback target itself (403), and the legacy
            # proxy answers a missing url parameter itself (400); a static
            # 405 or a 200 HTML fallback means the route is not live.
            proxy=$(curl -sS -o /tmp/proxy.json -w "%{http_code}" --max-time 20 \
              -H 'Content-Type: application/json' \
              -d '{"targetUrl":"http://127.0.0.1/x.json","protocolVersion":1}' \
              "https://${{ env.SITE_HOST }}/api/proxy" || true)
            legacy_proxy=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/proxy" || true)
            # Pages canonicalizes .../index.html to the directory form (308),
            # so the help gate uses /beta/help/ directly.
            help=$(curl -sS -o /tmp/help.html -w "%{http_code}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/beta/help/" || true)
            # Exposure gate: the deployment must serve only the assembled
            # dist/ tree. Repository files (README, crates) must not appear;
            # match on content, not status.
            readme=$(curl -sS --max-time 20 "https://${{ env.SITE_HOST }}/README.md" || true)
            cargo_toml_ct=$(curl -sS -o /dev/null -w "%{content_type}" --max-time 20 \
              "https://${{ env.SITE_HOST }}/crates/dezoomify-wasm/Cargo.toml" || true)
            repo_files_served=0
            if grep -q "next-generation rewrite" <<<"$readme"; then repo_files_served=1; fi
            if [ "$cargo_toml_ct" = "application/toml" ]; then repo_files_served=1; fi
            served_beta_hash="$(normalize_beta /tmp/beta.html 2>/dev/null | sha256sum | cut -d' ' -f1 || true)"
            if [ "$legacy" = "200" ] \
              && grep -q "rendering-canvas" /tmp/legacy.html \
              && grep -q "zoommanager.js" /tmp/legacy.html \
              && [ "$beta" = "200" ] \
              && [ "$served_beta_hash" = "$expected_beta_hash" ] \
              && grep -q "dz-url-input\|id=\"app\"" /tmp/beta.html \
              && grep -q "$main_asset" /tmp/beta.html \
              && [ "$main_js" = "200" ] \
              && [ "$proxy" = "403" ] && [ "$legacy_proxy" = "400" ] \
               && case "$wasm_js" in "200 application/javascript"*|"200 text/javascript"*) ;; *) false;; esac \
               && case "$wasm_bin" in "200 application/wasm"*) ;; *) false;; esac \
              && [ "$help" = "200" ] && grep -q "dz-help-topics" /tmp/help.html \
              && [ "$repo_files_served" = "0" ] \
              && ! grep -q "14 of 28" /tmp/beta.html; then
              echo "deployment live: legacy=$legacy beta=$beta main_asset=$main_asset main_js=$main_js proxy=$proxy legacy_proxy=$legacy_proxy wasm_js=$wasm_js wasm_bin=$wasm_bin help=$help repo_files_served=$repo_files_served beta_hash=$served_beta_hash"
              exit 0
            fi
            echo "attempt $i: legacy=$legacy beta=$beta main_asset=$main_asset main_js=$main_js proxy=$proxy legacy_proxy=$legacy_proxy wasm_js=$wasm_js wasm_bin=$wasm_bin help=$help repo_files_served=$repo_files_served beta_hash=${served_beta_hash:-none} (want $expected_beta_hash); retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 > 60 ? 60 : delay * 2 ))
          done
          echo "deployment did not serve expected content in time"
          exit 1
