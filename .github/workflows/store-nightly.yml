name: store-nightly

on:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  deployments: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.freeze.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/store-release.mjs freeze

  chromium:
    needs: freeze
    uses: ./.github/workflows/store-submit.yml
    with:
      browser: chromium
      release_plan: ${{ needs.freeze.outputs.plan }}
    secrets: inherit

  firefox:
    needs: freeze
    uses: ./.github/workflows/store-submit.yml
    with:
      browser: firefox
      release_plan: ${{ needs.freeze.outputs.plan }}
    secrets: inherit
