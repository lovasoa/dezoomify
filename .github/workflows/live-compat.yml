name: live-compat
on:
  schedule:
    # Weekly public canary: two real sites only (--limit 2). Advisory, never
    # blocking; see docs/testing.md.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask test live --dry-run --fixtures
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask test live --public --limit 2
