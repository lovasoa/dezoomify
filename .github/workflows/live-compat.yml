name: live-compat
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo xtask test live --dry-run --fixtures
