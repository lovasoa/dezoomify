name: live-compat
on:
  schedule:
    # Weekly public canary: two real sites only (--limit 2). Advisory, never
    # blocking; see docs/testing.md.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manifest
            args: --dry-run --fixtures
          - name: canary
            args: --public --limit 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          key: ${{ matrix.name == 'canary' && 'live' || 'xtask' }}
      - run: cargo xtask test live ${{ matrix.args }}
