version: 2
multi-ecosystem-groups:
  dependencies:
    schedule: {interval: weekly}
updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    # The glib advisory fix (0.20) is incompatible with the tauri 2 / gtk 0.18
    # dependency chain, and glib is only linked behind the optional `tauri`
    # feature of workspace member apps/desktop/src-tauri, so security
    # updates for that range are recorded as consciously deferred here.
    ignore:
      - dependency-name: glib
        versions: [">=0.15.0, <0.20.0"]
      - dependency-name: tauri
        # Tauri 2.12 changes WebView2 and breaks the test-only WebDriver plugin.
        # Hold major/minor version updates until that plugin catches up; keep
        # patch and security updates available.
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
