name: setup-node-pnpm
description: Set up the repository-pinned Node and pnpm versions, optionally installing the workspace
inputs:
  install:
    description: Install all workspace dependencies with the frozen root lockfile
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        # The action reads packageManager from package.json.
        cache: ${{ inputs.install }}
        # Use the pinned Node runtime above instead of pnpm's bundled runtime.
        standalone: false
    - name: Install workspace dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
