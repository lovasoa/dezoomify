name: setup-rust
description: Install the repository Rust toolchain and cache its dependencies
inputs:
  key:
    description: Partition caches for matrix jobs that build different artifacts
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read the repository toolchain
      id: toolchain
      shell: bash
      run: echo "version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
    - name: Install repository targets and components
      shell: bash
      run: rustup show
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.key }}
