name: setup-nasm
description: Install NASM for native x86-64 AVIF assembly optimizations
runs:
  using: composite
  steps:
    - name: Install NASM (Linux)
      if: runner.arch == 'X64' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm
    - name: Install NASM (macOS)
      if: runner.arch == 'X64' && runner.os == 'macOS'
      shell: bash
      run: brew install nasm
    - name: Install NASM (Windows)
      if: runner.arch == 'X64' && runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install nasm --no-progress -y
        if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
        "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
