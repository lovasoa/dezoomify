name: setup-windows-bundlers
description: Install and expose the pinned WiX v3 and NSIS toolchains
runs:
  using: composite
  steps:
    - name: Install WiX and NSIS
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        function Install-Bundler($package, $version) {
          # Chocolatey's community feed can return transient gateway errors.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install $package --version=$version --yes --no-progress
            $code = $LASTEXITCODE
            if ($code -in @(0, 1641, 3010)) { return }
            if ($attempt -eq 3) {
              throw "$package installation failed after $attempt attempts with exit code $code"
            }
            Write-Warning "$package installation failed with exit code $code; retrying in 15 seconds"
            Start-Sleep -Seconds 15
          }
        }
        Install-Bundler wixtoolset 3.14.1.20250415
        Install-Bundler nsis 3.12.0

        $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue |
          Sort-Object FullName -Descending | Select-Object -First 1
        $nsis = Get-Item "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -ErrorAction SilentlyContinue
        if (-not $wix) { throw 'candle.exe is missing after installing WiX' }
        if (-not $nsis) { throw 'makensis.exe is missing after installing NSIS' }

        Add-Content -Path $env:GITHUB_PATH -Value $wix.Directory.FullName
        Add-Content -Path $env:GITHUB_PATH -Value $nsis.Directory.FullName
        & $wix.FullName '-?'
        if ($LASTEXITCODE -ne 0) { throw 'candle.exe prerequisite check failed' }
        & $nsis.FullName '-VERSION'
        if ($LASTEXITCODE -ne 0) { throw 'makensis.exe prerequisite check failed' }
