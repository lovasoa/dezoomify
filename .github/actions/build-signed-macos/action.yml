name: build-signed-macos
description: Build, notarize, verify, install, and launch the macOS release artifacts
inputs:
  version:
    description: Version from the frozen release plan in target/release-dist
    required: true
runs:
  using: composite
  steps:
    - name: Build and notarize macOS artifacts
      shell: bash
      env:
        DEZOOMIFY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p target/macos-signing
        v="$DEZOOMIFY_VERSION"
        # Tauri signs and notarizes the app before creating its updater archive.
        cargo xtask release build --plan "target/release-dist/$v/plan.json" --target desktop-macos-aarch64 2>&1 | tee target/macos-signing/build.log
        DMG="target/release-dist/$v/desktop-macos-aarch64/dezoomify-desktop-v$v-macos-aarch64.dmg"
        xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
        xcrun stapler staple "$DMG"
    - name: Verify installer and updater, then install and launch each app
      shell: bash
      env:
        DEZOOMIFY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        DIST="target/release-dist/$DEZOOMIFY_VERSION/desktop-macos-aarch64"
        DMG="$DIST/dezoomify-desktop-v$DEZOOMIFY_VERSION-macos-aarch64.dmg"
        ARCHIVE="$DIST/dezoomify-desktop-v$DEZOOMIFY_VERSION-macos-aarch64.app.tar.gz"
        REQUIREMENT="anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
        codesign --verify --strict --verbose=4 -R="$REQUIREMENT" "$DMG"
        xcrun stapler validate "$DMG"
        spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
        MNT="$(mktemp -d)"
        STAGING="$(mktemp -d)"
        APP_PID=""
        cleanup() {
          if [ -n "$APP_PID" ]; then kill "$APP_PID" 2>/dev/null || true; fi
          hdiutil detach "$MNT" || true
          rmdir "$MNT" || true
          rm -rf "$STAGING"
        }
        trap cleanup EXIT
        printf 'Y\n' | hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
        cmp target/desktop-dmg/background.png "$MNT/.background/background.png"
        test -s "$MNT/.DS_Store"
        test -s "$ARCHIVE.sig"
        mkdir "$STAGING/updater"
        tar -xzf "$ARCHIVE" -C "$STAGING/updater"
        for SOURCE in installer updater; do
          APP="$MNT/Dezoomify.app"
          if [ "$SOURCE" = updater ]; then APP="$STAGING/updater/Dezoomify.app"; fi
          mkdir -p "$STAGING/$SOURCE-installed"
          INSTALLED="$STAGING/$SOURCE-installed/Dezoomify.app"
          ditto "$APP" "$INSTALLED"
          codesign --verify --deep --strict --verbose=4 -R="$REQUIREMENT and identifier \"dev.ophir.dezoomify\"" "$INSTALLED"
          codesign --display --verbose=4 "$INSTALLED" 2>&1 | tee "target/macos-signing/$SOURCE-signature.log" | grep -E 'flags=.*\(.*runtime.*\)'
          xcrun stapler validate "$INSTALLED"
          spctl --assess --type execute --verbose=4 "$INSTALLED"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$INSTALLED/Contents/Info.plist")"
          "$INSTALLED/Contents/MacOS/$EXECUTABLE" > "target/macos-signing/$SOURCE-launch.log" 2>&1 &
          APP_PID=$!
          sleep 15
          kill -0 "$APP_PID"
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          APP_PID=""
        done
        shasum -a 256 "$DMG" "$ARCHIVE" "$ARCHIVE.sig" | tee target/macos-signing/sha256.txt
        {
          echo 'macOS release signing E2E passed'
          echo "Commit: $(git rev-parse HEAD)"
          echo "Version: $DEZOOMIFY_VERSION"
          echo 'DMG and updater app: expected Apple team and identifier, hardened runtime, notarization tickets, Gatekeeper acceptance, installation, and 15-second launch verified.'
        } | tee target/macos-signing/result.txt >> "$GITHUB_STEP_SUMMARY"
