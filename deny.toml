[advisories]
ignore = [
    # rav1e 0.8.1 still uses this compile-time macro crate. This advisory
    # reports upstream archival, not a vulnerability; remove on upstream migration.
    { id = "RUSTSEC-2024-0436", reason = "rav1e's transitive paste 1.0.15 is unmaintained; no vulnerability is reported or compatible replacement available" },
]

[licenses]
allow = ["0BSD", "AGPL-3.0-only", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "GPL-3.0-only", "GPL-3.0-or-later", "ISC", "MIT", "Unicode-3.0", "Unlicense", "Zlib"]
# Native scraper's Servo CSS dependencies; upstream source is pinned by Cargo.lock.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    # rav1e's cfg(fuzzing)-only dependency; not linked into shipped products.
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
