[workspace]
members = ["crates/xtask", "crates/fixture-server", "crates/dezoomify-core", "crates/dezoomify-protocol", "crates/dezoomify-job", "crates/dezoomify-wasm", "crates/dezoomify-native", "apps/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lovasoa/dezoomify"

# Shared lint policy (todo 6.1): `[workspace.lints]` is the authored default
# (`missing_docs`/`pedantic` warn so legacy debt stays visible; `nursery`
# stays allowed until audited). NOTE (cargo 1.98): `[lints] workspace = true`
# cannot be combined with per-lint overrides in the same manifest, so only
# debt-free crates inherit it bare; crates with legacy debt carry manual
# `[lints.*]` tables mirroring this policy plus dated `allow` notes, and
# switch back to `workspace = true` once their debt clears.
# `clippy::unwrap_used` is deliberately NOT in this table: a workspace deny
# would also lint integration `tests/` targets, while the policy is "deny
# in shipped `src`, allow in tests". Each crate therefore denies it at its
# own crate roots (`lib.rs`/`main.rs`/bins, which never cover `tests/`),
# and unit tests are exempt via `allow-unwrap-in-tests` in `clippy.toml`.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "allow"

[workspace.dependencies]
ed25519-dalek = { version = "3", default-features = false }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
serde_yaml = "0.9"
serde-xml-rs = "0.8"
quick-xml = "0.42"
json5 = "1.3"
url = "2.5"
regex = "1"
memchr = "2"
custom_error = "1.7"
evalexpr = "13"
itertools = "0.15"
krpano-decrypt = "0.2"
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
aes = "0.9"
cbc = "0.2"
thiserror = "2"
html-escape = "0.2"
ureq = "3.4"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
