[workspace]
members = ["crates/xtask", "crates/fixture-server", "crates/dezoomify-core", "crates/dezoomify-protocol", "crates/dezoomify-job", "crates/dezoomify-wasm", "crates/dezoomify-native", "apps/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lovasoa/dezoomify-ng"

[workspace.dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde-xml-rs = "0.8"
quick-xml = "0.42"
json5 = "1.3"
url = "2.5"
regex = "1"
memchr = "2"
custom_error = "1.7"
evalexpr = "13"
itertools = "0.15"
krpano-decrypt = "0.2"
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
aes = "0.9"
cbc = "0.2"
thiserror = "2"
ureq = "2.12"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
