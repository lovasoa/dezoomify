[package]
name = "dezoomify-cli"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Command-line app composing the native runtime."
repository = "https://github.com/lovasoa/dezoomify-ng"

[[bin]]
name = "dezoomify-cli"
path = "src/main.rs"

[dependencies]
dezoomify-native = { path = "../../crates/dezoomify-native" }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
dezoomify-fixture-server = { path = "../../crates/fixture-server" }
axum = "0.8"
