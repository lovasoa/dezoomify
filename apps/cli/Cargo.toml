[package]
name = "dezoomify-cli"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "Command-line app composing the native runtime."
repository = "https://github.com/lovasoa/dezoomify"

[[bin]]
name = "dezoomify-cli"
path = "src/main.rs"

[dependencies]
dezoomify = { path = "../../crates/dezoomify" }
dezoomify-native = { path = "../../crates/dezoomify-native" }
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
dezoomify-fixture-server = { path = "../../crates/fixture-server" }
axum.workspace = true

# 6.1 debt (unblocked for cargo 1.98: workspace+override does not parse):
# pedantic cleanups are pending; fix them before re-tightening.
[lints.clippy]
pedantic = "allow"
