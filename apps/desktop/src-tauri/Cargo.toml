[package]
name = "dezoomify-desktop"
version = "3.0.3"
edition.workspace = true
license.workspace = true
description = "Dezoomify desktop shell (lean offline shell by default; real Tauri window behind the `tauri` feature)"
repository.workspace = true

# Workspace member: shares the root Cargo.lock. The default build stays lean
# (pure Rust, no webview system packages), so the Tauri SDK stays behind the
# optional non-default `tauri` feature (Linux needs libwebkit2gtk-4.1-dev,
# libgtk-3-dev, libsoup-3.0-dev, ... only for that feature);
# tauri.conf.json and capabilities are validated by node tests.

[lib]
name = "dezoomify_desktop"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "dezoomify-desktop"
path = "src/main.rs"

[[bin]]
name = "dezoomify-native-host"
path = "src/bin/dezoomify-native-host.rs"

# 6.1 debt (unblocked for cargo 1.98): shell docs pending.
[lints.rust]
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"

[dependencies]
# Engine deps (inward only: core -> job -> native runtime + protocol DTOs).
# All pure Rust via dezoomify-native (ureq/rustls/image/url/sha2); no webview
# system packages, so the lean offline default still builds anywhere.
dezoomify-core = { path = "../../../crates/dezoomify-core" }
dezoomify-job = { path = "../../../crates/dezoomify-job" }
dezoomify-native = { path = "../../../crates/dezoomify-native" }
dezoomify-protocol = { path = "../../../crates/dezoomify-protocol" }
# Lean offline shell: pure Rust only (no webview system packages). ed25519-dalek
# is pure Rust and provides real updater signature verification; serde/serde_json
# are pure Rust and provide the Native Messaging wire JSON (framed, bounded).
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Real window shell (optional; see the `tauri` feature below).
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
# Embedded W3C WebDriver server for the real-window E2E only. Registered
# behind the non-default `testing-webdriver` feature so release bundles never
# open a WebDriver port (the plugin starts its server unconditionally on init).
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
open = { version = "5.4.3", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[features]
default = []
# Real Tauri window shell. Requires the platform webview system packages
# (on Linux: libwebkit2gtk-4.1-dev, libgtk-3-dev, libsoup-3.0-dev); the lean
# offline shell stays the default so this manifest keeps building anywhere.
tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance", "dep:open"]
# Test-only embedded WebDriver server, used exclusively by
# `cargo xtask test desktop --e2e-window` (selenium-webdriver client).
# Never enable this in a release bundle.
testing-webdriver = ["tauri", "dep:tauri-plugin-wdio-webdriver"]
