[package]
name = "dezoomify-desktop"
version = "3.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Dezoomify desktop shell (lean offline shell by default; real Tauri window behind the `tauri` feature)"
repository = "https://github.com/lovasoa/dezoomify"

# Standalone manifest: intentionally NOT a member of the root workspace. The
# default build stays lean (pure Rust, no webview system packages), so the
# manifest keeps building offline; tauri.conf.json and capabilities are
# validated by node tests. The real Tauri window shell is behind the
# non-default `tauri` feature and needs the platform webview packages
# (Linux: libwebkit2gtk-4.1-dev, libgtk-3-dev, libsoup-3.0-dev, ...).
[workspace]

[lib]
name = "dezoomify_desktop"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "dezoomify-desktop"
path = "src/main.rs"

[[bin]]
name = "dezoomify-native-host"
path = "src/bin/dezoomify-native-host.rs"

[dependencies]
# Lean offline shell: pure Rust only (no webview system packages). ed25519-dalek
# is pure Rust and provides real updater signature verification; serde/serde_json
# are pure Rust and provide the Native Messaging wire JSON (framed, bounded).
ed25519-dalek = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Real window shell (optional; see the `tauri` feature below).
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]

[features]
default = []
# Real Tauri window shell. Requires the platform webview system packages
# (on Linux: libwebkit2gtk-4.1-dev, libgtk-3-dev, libsoup-3.0-dev); the lean
# offline shell stays the default so this manifest keeps building anywhere.
tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater"]
