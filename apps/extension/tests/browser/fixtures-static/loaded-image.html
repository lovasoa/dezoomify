<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Loaded image</title></head>
  <body>
    <script src="/openseadragon-fixture.js"></script>
    <img id="artwork" style="width:100px;height:100px;object-fit:cover" alt="Blue rectangle"
      onload="ready()">
    <script>
      const inventory = Promise.all(Array.from({ length: 8 }, (_, index) => new Promise(resolve => {
        const script = document.createElement('script');
        const url = new URL(`/loaded-image-noise.js?asset=${index}`, location.href);
        if (index % 2) url.hostname = 'localhost';
        script.src = url.href;
        script.onload = script.onerror = resolve;
        document.head.append(script);
      })));
      async function ready() {
        await inventory;
        document.documentElement.dataset.viewerReady = 'true';
      }
      const artwork = document.getElementById('artwork');
      if (location.search === '?viewer') {
        artwork.remove();
        const element = document.body.appendChild(document.createElement('div'));
        element.id = 'viewer';
        element.style = 'width:600px;height:400px';
        const original = new URL('/loaded-image.png', location.href);
        original.hostname = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
        const viewer = OpenSeadragon({
          id: 'viewer', showNavigationControl: false,
          tileSources: { type: 'image', url: original.href },
        });
        viewer.addOnceHandler('open', ready);
        delete window.OpenSeadragon;
      } else if (location.search === '?link') {
        artwork.remove();
        const link = document.createElement('a');
        link.href = '/loaded-image.png';
        link.download = '';
        link.textContent = 'Download image';
        document.body.append(link);
        ready();
      } else if (!location.search || location.search === '?tiled') {
        if (location.search === '?tiled') {
          const metadata = document.createElement('script');
          metadata.textContent = `const dzi = ${JSON.stringify('/fixtures/deepzoom/basic/image' + '.dzi')};`;
          document.body.append(metadata);
        }
        artwork.src = '/loaded-image.png';
      }
      // RSL-style viewer: retain the HTTP resource behind an embedded data URL.
      else fetch('/loaded-image.png').then(response => response.blob()).then(blob => {
        const reader = new FileReader();
        reader.onload = () => artwork.src = reader.result;
        reader.readAsDataURL(blob);
      });
    </script>
  </body>
</html>
