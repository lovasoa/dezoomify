<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dezoomify E2E target</title>
  </head>
  <body>
    <h1>zoomable fixture page</h1>
    <script>
      // Simulates an embedded viewer: requests the zoomable source so the
      // extension's traffic scan can observe it. The fixture gateway on this
      // loopback origin serves the DZI for the virtual fixtures.test host.
      // The query-preserving `/fetch/<original-path>` form keeps the `.dzi`
      // suffix visible to URL-shape discovery (the bare `/fetch` outer path
      // is opaque to it).
      const scenario = new URLSearchParams(location.search).get("scenario");
      const source = scenario === "corrupt"
        ? "https://fixtures.test/cli/corrupt.dzi"
        : "https://fixtures.test/cli/pyramid.dzi";
      const sourceUrl = scenario === "permission"
        ? location.protocol + "//localhost:" + location.port + "/fetch/https://fixtures.test/cli/pyramid.dzi?url=" + encodeURIComponent("https://fixtures.test/cli/pyramid.dzi")
        : location.origin + "/fetch/" + source + "?url=" + encodeURIComponent(source);
      // Metadata is fetched from the source document's own origin. The
      // permission scenario differs only in the extension package: it starts
      // with no optional host grant, so the first tile request reaches the
      // visible permission boundary. Switching 127.0.0.1 to localhost here
      // made the fixture request cross-origin and failed before that boundary.
      fetch(sourceUrl)
        .then((r) => {
          if (!r.ok) throw new Error("status " + r.status);
          window.__sourceFetched = true;
        })
        .catch(() => {
          window.__sourceFetched = false;
        });
    </script>
  </body>
</html>
