<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dezoomify E2E target</title>
  </head>
  <body>
    <h1>zoomable fixture page</h1>
    <script>
      // Simulates an embedded viewer: requests the zoomable source so the
      // extension's traffic scan can observe it. The fixture gateway on this
      // loopback origin serves the DZI for the virtual fixtures.test host.
      // The query-preserving `/fetch/<original-path>` form keeps the `.dzi`
      // suffix visible to URL-shape discovery (the bare `/fetch` outer path
      // is opaque to it).
      const scenario = new URLSearchParams(location.search).get("scenario");
      const source = scenario === "corrupt"
        ? "https://fixtures.test/cli/corrupt.dzi"
        : "https://fixtures.test/cli/pyramid.dzi";
      // The metadata document belongs to the source page's origin. The
      // permission package grants that origin only; its derived tile request
      // then reaches the optional-host boundary naturally.
      fetch(location.origin + "/fetch/" + source + "?url=" + encodeURIComponent(source))
        .then((r) => {
          if (!r.ok) throw new Error("status " + r.status);
          window.__sourceFetched = true;
        })
        .catch(() => {
          window.__sourceFetched = false;
        });
    </script>
  </body>
</html>
