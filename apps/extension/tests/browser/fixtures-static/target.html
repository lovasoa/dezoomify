<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dezoomify E2E target</title>
  </head>
  <body>
    <h1>zoomable fixture page</h1>
    <script>
      // Simulates an embedded viewer: requests the zoomable source so the
      // extension's traffic scan can observe it on the fixture origin.
      // Ordinary file URLs preserve the metadata suffix for traffic discovery.
      // Build only the selected URL so HTML discovery cannot find other scenarios.
      const scenario = new URLSearchParams(location.search).get("scenario");
      const sourceName = scenario === "corrupt"
        ? "corrupt"
        : scenario === "permission"
          ? "permission-tiles"
          : scenario === "tile-redirect"
            ? "ImageProperties"
            : "pyramid";
      const extension = scenario === "permission" ? "yaml" : scenario === "tile-redirect" ? "xml" : "dzi";
      // The permission fixture's metadata is source-tab readable, while its
      // tile URLs deliberately use the equivalent but ungranted localhost
      // origin. This isolates the optional-host boundary from CORS behavior.
      const sourcePath = scenario === "retry"
        ? "/fixtures/failures/retry-approval/retry.dzi"
        : `/extension-inputs/${sourceName}.${extension}`;
      const sourceUrl = new URL(sourcePath, location.origin);
      fetch(sourceUrl)
        .then((r) => {
          if (!r.ok) throw new Error(`status ${r.status}`);
          window.__sourceFetched = true;
          document.documentElement.dataset.viewerReady = "true";
        })
        .catch(() => {
          window.__sourceFetched = false;
        });
    </script>
  </body>
</html>
