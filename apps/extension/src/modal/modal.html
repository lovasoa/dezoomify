<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dezoomify</title>
    <!-- Canonical shared theme (vendored mirror, never hand-edited): the
         modal reuses shared-ui renderView geometry, it never forks it. -->
    <link rel="stylesheet" href="../vendor/theme.css" />
    <style>
      /* Shell chrome only (close-button placement): the visual language is
         the canonical vendored theme; no dz-* geometry is defined here. */
      #dz-modal-shell { position: relative; }
      #dz-modal-dismiss { position: absolute; top: 8px; right: 8px; z-index: 5; }
    </style>
  </head>
  <body>
    <main class="dz-main" id="dz-modal-shell">
      <button type="button" id="dz-modal-dismiss" class="dz-modal-close" aria-label="Close dialog" title="Close">×</button>
      <div id="dz-modal-app"></div>
    </main>
    <script type="module" src="modal.js"></script>
  </body>
</html>
