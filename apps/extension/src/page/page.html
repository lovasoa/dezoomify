<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dezoomify browser extension</title>
    <link rel="stylesheet" href="vendor/theme.css" />
  </head>
  <body>
    <main class="dz-main">
      <div id="dz-app"></div>
      <div class="dz-card" id="dz-card">
        <div class="dz-header">
          <h1 class="dz-title"><span>Dezoomify browser extension</span></h1>
        </div>
        <div id="tabs"></div>
        <div class="dz-view-body dz-job-section" id="dz-job" hidden>
          <p class="dz-source-line" id="dz-source" hidden>Working on <span class="dz-source-url" id="dz-source-url"></span></p>
          <div class="dz-progress-header">
            <span class="dz-progress-status">
              <span class="dz-pulse" aria-hidden="true"></span>
              <span class="dz-progress-step-text" id="dz-step">Ready</span>
            </span>
            <span class="dz-progress-percent" id="dz-percent"></span>
          </div>
          <div class="dz-progress-track dz-indeterminate" id="dz-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Dezoomify progress">
            <div class="dz-progress-bar" id="dz-bar" style="width: 35%;"></div>
          </div>
          <p class="dz-tile-counts" id="dz-counts"></p>
          <div class="dz-progress-controls">
            <span class="dz-transport-badge" id="dz-transport">Browser session</span>
            <div class="dz-job-actions">
              <button type="button" class="dz-btn-secondary" id="dz-cancel" hidden>Cancel</button>
            </div>
          </div>
        </div>
        <div class="dz-view-body" id="dz-result" hidden></div>
        <details class="dz-details" id="dz-logwrap" hidden>
          <summary class="dz-summary"><span>Technical details &amp; logs</span></summary>
          <div class="dz-diagnostics" id="dz-diag">Status: idle</div>
          <pre id="log" class="dz-diagnostics dz-log"></pre>
        </details>
      </div>
    </main>
    <script type="module" src="page.js"></script>
  </body>
</html>
